name: Deploy Aaroha LMS to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Frontend
        run: |
          cd frontend
          npm run build

      - name: Prepare Deployment Payload
        run: |
          mkdir -p deploy_payload/api
          # Copy compiled frontend into root of deployment payload
          cp -r frontend/dist/* deploy_payload/
          # Copy root .htaccess for SPA routing
          cp frontend/public/.htaccess deploy_payload/.htaccess
          # Copy backend API files into api/
          cp -r backend/* deploy_payload/api/
          # Remove local env.php so we preserve server production config
          rm -f deploy_payload/api/config/env.php

      - name: Sanitize FTP Configuration
        id: ftp-config
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^ftp://||' -e 's|^ftps://||' -e 's|/$||')
          echo "server=$CLEAN_SERVER" >> $GITHUB_OUTPUT

      - name: Sync Files to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-config.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/lms/' }}
          local-dir: ./deploy_payload/
          dangerous-clean-slate: false

