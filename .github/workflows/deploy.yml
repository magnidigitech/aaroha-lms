name: Deploy Aaroha LMS to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Production Frontend
        run: |
          cd frontend
          npm run build

      - name: Initialize SQLite Fallback Database
        run: |
          python database/init_sqlite.py

      - name: Prepare Deployment Payload
        run: |
          mkdir -p deploy_payload/api deploy_payload/database
          # Copy compiled frontend into root of deployment payload
          cp -r frontend/dist/* deploy_payload/
          # Copy root .htaccess for SPA routing
          cp frontend/public/.htaccess deploy_payload/.htaccess
          # Copy backend API files into api/
          cp -r backend/* deploy_payload/api/
          # Explicitly ensure all core config files exist in api/config/
          mkdir -p deploy_payload/api/config deploy_payload/api/middleware
          cp backend/config/*.php deploy_payload/api/config/ 2>/dev/null || true
          # Replicate jwt.php across multiple path levels for zero-risk resolution
          cp backend/config/jwt.php deploy_payload/api/config/jwt.php
          cp backend/config/jwt.php deploy_payload/api/middleware/jwt.php
          cp backend/config/jwt.php deploy_payload/api/jwt.php
          cp backend/config/jwt.php deploy_payload/jwt.php
          # Ensure backend .htaccess and config .htaccess are copied explicitly
          cp backend/.htaccess deploy_payload/api/.htaccess
          cp backend/config/.htaccess deploy_payload/api/config/.htaccess
          # Copy secure SQLite database as high-availability fallback
          cp database/lms.sqlite deploy_payload/api/config/lms.sqlite
          cp database/lms.sqlite deploy_payload/database/lms.sqlite
          cp database/.htaccess deploy_payload/database/.htaccess
          # Copy schema and seed definitions for automatic zero-downtime MySQL provisioning
          cp database/schema.sql deploy_payload/api/config/schema.sql
          cp database/seeds_dev.sql deploy_payload/api/config/seeds_dev.sql
          # Remove tests and local config to keep deployment secure
          rm -rf deploy_payload/api/tests
          rm -f deploy_payload/api/config/env.php
          # Create deployment verification marker
          echo "{\"commit\":\"${GITHUB_SHA}\",\"deployed_at\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",\"build\":\"production\"}" > deploy_payload/version.json
          # Validate deployment payload integrity
          test -f deploy_payload/index.html || { echo "ERROR: index.html missing from payload!"; exit 1; }
          test -f deploy_payload/.htaccess || { echo "ERROR: root .htaccess missing from payload!"; exit 1; }
          test -f deploy_payload/api/index.php || { echo "ERROR: api/index.php missing from payload!"; exit 1; }
          test -f deploy_payload/api/.htaccess || { echo "ERROR: api/.htaccess missing from payload!"; exit 1; }
          test -f deploy_payload/api/config/jwt.php || { echo "ERROR: api/config/jwt.php missing from payload!"; exit 1; }
          test -f deploy_payload/api/config/database.php || { echo "ERROR: api/config/database.php missing from payload!"; exit 1; }
          test -f deploy_payload/version.json || { echo "ERROR: version.json missing from payload!"; exit 1; }
          echo "Deployment payload validation passed successfully."

      - name: Deploy to Hostinger via Native Python FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          LOCAL_DIR: ./deploy_payload
        run: |
          python .github/scripts/deploy.py

      - name: Archive Deploy Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log
          if-no-files-found: ignore

