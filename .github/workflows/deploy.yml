name: Deploy Aaroha LMS to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Production Frontend
        run: |
          cd frontend
          npm run build

      - name: Prepare Deployment Payload
        run: |
          mkdir -p deploy_payload/api
          # Copy compiled frontend into root of deployment payload
          cp -r frontend/dist/* deploy_payload/
          # Copy root .htaccess for SPA routing
          cp frontend/public/.htaccess deploy_payload/.htaccess
          # Copy backend API files into api/
          cp -r backend/* deploy_payload/api/
          # Ensure backend .htaccess and config .htaccess are copied explicitly
          cp backend/.htaccess deploy_payload/api/.htaccess
          cp backend/config/.htaccess deploy_payload/api/config/.htaccess
          # Remove tests and local config to keep deployment secure
          rm -rf deploy_payload/api/tests
          rm -f deploy_payload/api/config/env.php
          # Create deployment verification marker
          echo "{\"commit\":\"${GITHUB_SHA}\",\"deployed_at\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",\"build\":\"production\"}" > deploy_payload/version.json

      - name: Deploy to Hostinger via Native Python FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          LOCAL_DIR: ./deploy_payload
        run: |
          python .github/scripts/deploy.py

